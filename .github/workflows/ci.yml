# CI minimal: install dependensi ter-pin lalu jalankan suite regresi.
# Catatan: pytest TIDAK ada di requirements.txt (sengaja minimal);
# di-install eksplisit di sini.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run regression tests
        run: pytest tests/ -v
